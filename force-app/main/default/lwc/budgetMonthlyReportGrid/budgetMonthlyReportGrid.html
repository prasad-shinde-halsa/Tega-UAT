<template>
    <div class="header">
        <button type="button" class="back" onclick={handleBack}>Back</button>
        <h2>{title}</h2>
    </div>

    <p lwc:if={errorMessage} class="message error" role="alert">{errorMessage}</p>

    <div class="sheet">
        <lightning-spinner lwc:if={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>
        <table>
            <thead>
                <tr>
                    <template for:each={columns} for:item="col">
                        <th key={col.key} scope="col" class={col.type}>{col.label}</th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template for:each={rows} for:item="row">
                    <tr key={row.key}>
                        <template for:each={row.cells} for:item="cell">
                            <td key={cell.key} class={cell.className}>{cell.value}</td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
        <p lwc:if={showNoRows} class="message">No records found.</p>
    </div>
</template>
