<template>

    <!-- Loading state -->
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-p-around_large">
            <lightning-spinner alternative-text="Cloning..." size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="form-wrapper">

            <!-- Header -->
            <div class="form-header">
                <div class="header-icon-wrap">
                    <lightning-icon icon-name="standard:proposition" size="small"></lightning-icon>
                </div>
                <div>
                    <p class="form-title">Clone Proposal Form</p>
                    <p class="form-subtitle">{oppName}</p>
                </div>
            </div>

            <div class="form-body">

                <!-- Warning -->
                <div class="warning-banner">
                    <lightning-icon icon-name="utility:warning" size="x-small" variant="warning" class="flex-shrink"></lightning-icon>
                    <div class="slds-m-left_x-small">
                        <p class="warning-title">Original opportunity is closed</p>
                        <p class="warning-body">
                            Select an open opportunity from the same account to link the cloned record.
                        </p>
                    </div>
                </div>

                <!-- Original opp context -->
                <div class="context-strip">
                    <div>
                        <p class="context-label">Original opportunity</p>
                        <p class="context-value">{oppName}</p>
                    </div>
                    <span class="stage-closed-badge">{oppStage}</span>
                </div>

                <!-- Apex error -->
                <template if:true={errorMessage}>
                    <div class="error-banner">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                        <p class="error-text slds-m-left_x-small">{errorMessage}</p>
                    </div>
                </template>

                <!-- Search label -->
                <div class="field-group">
                    <label class="field-label">
                        <abbr class="slds-required" title="required">*</abbr>&nbsp;Select open opportunity
                    </label>

                    <!-- SELECTED: pill -->
                    <template if:true={isSelected}>
                        <div class="selected-pill">
                            <lightning-icon icon-name="standard:opportunity" size="x-small"></lightning-icon>
                            <span class="pill-name">{newOpportunityName}</span>
                            <button class="pill-remove-btn" onclick={handleClearSelection} title="Remove">
                                <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                            </button>
                        </div>
                        <p class="verified-text">
                            <lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon>
                            &nbsp;Opportunity verified and linked
                        </p>
                    </template>

                    <!-- NOT SELECTED: input + dropdown -->
                    <template if:false={isSelected}>
                        <div class="input-outer">
                            <div class="input-icon-left">
                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                            </div>
                            <input
                                type="text"
                                class="custom-input"
                                placeholder="Type to search open opportunities..."
                                value={searchTerm}
                                oninput={handleSearchInput}
                                autocomplete="off" />
                            <template if:true={searching}>
                                <div class="input-spinner">
                                    <lightning-spinner size="x-small" alternative-text="Searching..."></lightning-spinner>
                                </div>
                            </template>
                        </div>

                        <!-- Dropdown results -->
                        <template if:true={showDropdown}>
                            <ul class="results-list" role="listbox">
                                <template for:each={searchResults} for:item="opp">
                                    <li key={opp.Id}
                                        class="result-item"
                                        data-id={opp.Id}
                                        data-name={opp.Name}
                                        onclick={handleSelectOpportunity}
                                        role="option">
                                        <div class="result-icon">
                                            <lightning-icon icon-name="standard:opportunity" size="x-small"></lightning-icon>
                                        </div>
                                        <div class="result-text">
                                            <p class="result-name">{opp.Name}</p>
                                            <p class="result-meta">{opp.StageName} &bull; {opp.Account.Name}</p>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>

                        <!-- No results -->
                        <template if:true={noResults}>
                            <div class="no-results-box">
                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                <span class="slds-m-left_x-small">No open opportunities found for <strong>{searchTerm}</strong></span>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Validation error -->
                <template if:true={oppError}>
                    <p class="validation-error">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                        &nbsp;Please select an open opportunity to continue.
                    </p>
                </template>

            </div>

            <!-- Footer -->
            <div class="form-footer">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                    disabled={cloning}>
                </lightning-button>
                <lightning-button
                    label={cloneLabel}
                    variant="brand"
                    icon-name="utility:copy"
                    onclick={handleClone}
                    disabled={cloneDisabled}>
                </lightning-button>
            </div>

        </div>
    </template>

</template>
