<template>
    <lightning-spinner if:true={isLoading} size="large" alternative-text="Loading...">

    </lightning-spinner>
    <div class="slds-grid slds-grid_vertical-align-center ">

        <!-- Left spacer -->
        <div class="slds-col slds-size_1-of-3"></div>

        <!-- Center: Header -->
        <div class="slds-col slds-size_1-of-3 slds-text-align_center">
            <h1 class="slds-text-heading_medium" style="font-weight: bold; color: rgb(244, 232, 232)">Run Rate
                Calculator
            </h1>
        </div>

    </div>
    <div class="slds-grid slds-wrap slds-p-around_medium" style="margin-top: 10px; border: auto;">

        <div class={getColClass} style="border: auto;">
            <lightning-combobox label="Calculate By FY" value={selectedFY} options={financialYearOptions}
                onchange={handleFYChange} class="neon-combobox">
            </lightning-combobox>
        </div>
        <div class={getColClass} style="border: auto;">
            <lightning-combobox label="Calculate By Month" value={selectedMonth} options={monthOptions}
                onchange={handleMonthChange} class="neon-combobox">
            </lightning-combobox>
        </div>
        <div class={getColClass} style="border: auto;">
            <lightning-input type="search" label="Search By PMG" placeholder="Enter search term ..."
                onchange={handleSearchPMG} class="neon-input" value={searchTermPMG}>
            </lightning-input>
        </div>
        <div class={getColClass} style="border: auto;">
            <lightning-combobox label="Search By Order Type" value={selectedOrderType} options={OrderTypeOptions}
                onchange={handleOrderTypeChange} class="neon-combobox">
            </lightning-combobox>
        </div>
        <!-- <div class={getColClass}>
            <lightning-combobox label="Search By Level 1" value={selectedLevel1} options={Level1Options}
                onchange={handleLevel1Change} class="neon-combobox">
            </lightning-combobox>
        </div> -->
        <template if:true={showLevel2}>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 slds-p-horizontal_small">
                <lightning-combobox label="Search By Level 2" value={selectedLevel2} options={Level2Options}
                    onchange={handleLevel2Change} class="neon-combobox">
                </lightning-combobox>
            </div>
        </template>
    </div>
    <template if:false={showTable}>
        <header class="slds-modal__header" style="height: auto; background-color: rgb(1, 68, 134);">
            <h2 class="slds-text-heading_medium slds-hyphenate custom-header-title"
                style="font-weight: bold; font-size: 1.2em; color: rgb(255, 255, 255);">
                No Details Found</h2>
        </header>
    </template>

    <template if:true={showTable}>

        <header class="slds-modal__header slds-grid slds-grid_vertical-align-center"
            style="background-color: rgb(1, 68, 134);">
            <!-- Title centered -->
            <h2 class="slds-text-heading_medium slds-hyphenate slds-col slds-align_absolute-center"
                style="font-weight: bold; font-size: 1.2em; color: rgb(255, 255, 255);">
                YTD Run Rate and Actual Run Rate Details Upto {endDate}
            </h2>
        </header>
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th colspan="2">FY : {selectedFY}</th>
                        <th colspan="2">Till {selectedMonth}</th>
                        <th colspan="3">{selectedMonth}</th>
                    </tr>
                    <tr style="color:rgb(1, 68, 134);">
                        <!-- FY Section -->
                        <th>Yearly Budget</th>
                        <th>Yearly Run Rate ({showCurrecy} / Month)</th>

                        <!-- Till Month Section -->
                        <th>YTD Budget</th>
                        <th>YTD Run Rate ({showCurrecy} / Month)</th>

                        <!-- Month Section -->
                        <th>Actual</th>
                        <th>Actual Run Rate ({showCurrecy} / Month)</th>
                        <th>Req Run Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <!-- FY Data -->
                        <td>{showCurrecy} {processedRow.budget}</td>
                        <td>{processedRow.yearlyRunRate}</td>

                        <!-- Till Month Data -->
                        <td>{showCurrecy} {processedRow.ytdBudget}</td>
                        <td>{processedRow.ytdRunRate}</td>

                        <!-- Month Data -->
                        <td>{showCurrecy} {processedRow.actual}</td>
                        <td>{processedRow.actualRunRate}</td>
                        <td>{processedRow.requiredRunRate}</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </template>

</template>
